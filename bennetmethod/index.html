<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BENNET Method - Kitten Quest (Realtime Cloud Sync)</title>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #ff6b81;
      --primary-dark: #ee5253;
      --secondary: #feca57;
      --accent: #48dbfb;
      --bg: #fff5f6;
      --card-bg: #ffffff;
      --text: #2d3436;
      --text-muted: #636e72;
      --border-radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; min-height: 100vh; }

    header { text-align: center; margin-bottom: 25px; }
    h1 { font-size: 2.2rem; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; gap: 10px; }
    
    .sync-status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 18px; background: rgba(72, 219, 251, 0.18);
      border-radius: 20px; font-size: 0.85rem; color: #0abde3; font-weight: 700; margin-top: 10px;
    }
    .sync-indicator { width: 10px; height: 10px; border-radius: 50%; background: #10ac84; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

    .main-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white; border: none; padding: 22px 36px; font-size: 1.35rem; font-weight: bold;
      border-radius: 50px; cursor: pointer; width: 100%; max-width: 480px; margin: 20px auto;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      box-shadow: 0 10px 25px rgba(238, 82, 83, 0.4);
      transition: all 0.2s ease;
    }
    .main-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(238, 82, 83, 0.5); }
    .main-btn:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(238, 82, 83, 0.3); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
    .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); border: 1px solid rgba(255, 107, 129, 0.1); }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-top: 15px; }
    .stat-box { background: #fffcfc; border: 1px solid #ffe8eb; padding: 14px; border-radius: 16px; }
    .stat-val { font-size: 1.6rem; font-weight: bold; color: var(--primary-dark); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-top: 4px; }

    .xp-container { margin-top: 15px; }
    .xp-bar-bg { background: #ffe8eb; height: 10px; border-radius: 10px; overflow: hidden; margin-top: 6px; }
    .xp-bar-fill { background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; width: 0%; transition: width 0.4s ease; }

    .kitten-box { text-align: center; position: relative; cursor: pointer; user-select: none; }
    .kitten-svg { width: 150px; height: 150px; transition: transform 0.2s; }
    .kitten-box:hover .kitten-svg { transform: scale(1.08); }
    .kitten-box:active .kitten-svg { transform: scale(0.95); }

    .speech-bubble {
      background: #f1f2f6; border-radius: 18px; padding: 10px 16px; font-size: 0.9rem;
      margin-bottom: 12px; display: inline-block; position: relative; font-weight: 600; color: #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .speech-bubble::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid #f1f2f6;
    }

    .log-list { max-height: 280px; overflow-y: auto; list-style: none; margin-top: 12px; }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f8f9fa; font-size: 0.9rem; }
    .log-item:last-child { border-bottom: none; }
    .log-badge { background: #e3fcf7; color: #0be881; font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }
  </style>
</head>
<body>

<header>
  <h1>🐾 BENNET Method Quest</h1>
  <div class="sync-status">
    <div class="sync-indicator"></div>
    <span id="sync-text">Connecting to Realtime Cloud...</span>
  </div>
</header>

<main>
  <button class="main-btn" id="action-btn">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
    <span>I just used the BENNET method!</span>
  </button>

  <div class="grid">
    <!-- Level & Stats Dashboard -->
    <div class="card">
      <h3 style="color: var(--text);"><i class="fa-solid fa-trophy text-amber-400" style="color:#feca57; margin-right:8px;"></i>Level & Progress</h3>
      
      <div class="xp-container">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">
          <span>XP Progress</span>
          <span id="xp-text">0 / 100 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" id="xp-bar"></div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="lvl-display">1</div>
          <div class="stat-lbl">Level</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="streak-display">0</div>
          <div class="stat-lbl">Streak</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="count-display">0</div>
          <div class="stat-lbl">Total Uses</div>
        </div>
      </div>
    </div>

    <div class="card kitten-box" id="kitten-card" title="Click to pet Whiskers!">
      <div class="speech-bubble" id="kitten-speech">Click me for a meow! 🐾</div>
      <div>
        <svg class="kitten-svg" viewBox="0 0 100 100">
          <!-- Ear Backings -->
          <polygon points="25,38 35,12 45,30" fill="#feca57"/>
          <polygon points="28,34 35,18 42,28" fill="#ff6b81"/>
          <polygon points="75,38 65,12 55,30" fill="#feca57"/>
          <polygon points="72,34 65,18 58,28" fill="#ff6b81"/>
          <!-- Head -->
          <circle cx="50" cy="52" r="28" fill="#feca57"/>
          <!-- Cheeks -->
          <circle cx="36" cy="58" r="5" fill="#ff6b81" opacity="0.4"/>
          <circle cx="64" cy="58" r="5" fill="#ff6b81" opacity="0.4"/>
          <!-- Eyes -->
          <circle cx="38" cy="48" r="4" fill="#2d3436"/>
          <circle cx="40" cy="46" r="1.5" fill="#ffffff"/>
          <circle cx="62" cy="48" r="4" fill="#2d3436"/>
          <circle cx="64" cy="46" r="1.5" fill="#ffffff"/>
          <!-- Nose & Mouth -->
          <polygon points="50,55 47,51 53,51" fill="#ff6b81"/>
          <path d="M 45 58 Q 50 63 50 56 Q 50 63 55 58" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
          <!-- Whiskers -->
          <line x1="22" y1="50" x2="32" y2="52" stroke="#2d3436" stroke-width="1.5"/>
          <line x1="20" y1="56" x2="31" y2="55" stroke="#2d3436" stroke-width="1.5"/>
          <line x1="78" y1="50" x2="68" y2="52" stroke="#2d3436" stroke-width="1.5"/>
          <line x1="80" y1="56" x2="69" y2="55" stroke="#2d3436" stroke-width="1.5"/>
        </svg>
      </div>
      <p style="font-weight:bold; color: var(--text-muted); font-size:0.9rem;">Whiskers your BENNET Companion</p>
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <h3 style="color: var(--text);"><i class="fa-solid fa-clock-rotate-left" style="color:var(--primary); margin-right:8px;"></i>Timestamp History</h3>
    <ul class="log-list" id="log-list">
      <li style="color: var(--text-muted); padding: 12px; text-align: center;">No entries logged yet! Tap the button above!</li>
    </ul>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Pre-configured Firebase Settings
  const firebaseConfig = {
    apiKey: "AIzaSyA__fPJvlQHR8GtSVocoaEu-AeyC6RfGWY",
    authDomain: "bennet-65ce7.firebaseapp.com",
    databaseURL: "https://bennet-65ce7-default-rtdb.firebaseio.com",
    projectId: "bennet-65ce7",
    storageBucket: "bennet-65ce7.firebasestorage.app",
    messagingSenderId: "985540291991",
    appId: "1:985540291991:web:8eb2b935599c7deeed68d2",
    measurementId: "G-FLHPRDKW0T"
  };

  // Initialize Firebase Realtime DB
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'bennet_tracker/shared_user');

  let state = {
    xp: 0,
    level: 1,
    streak: 0,
    totalLogs: 0,
    lastLoggedDate: null,
    logs: []
  };

  // Web Audio Synth for Meow Sounds
  function playMeow() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(850, ctx.currentTime + 0.15);
      osc.frequency.exponentialRampToValueAtTime(550, ctx.currentTime + 0.35);

      gain.gain.setValueAtTime(0.01, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.36);
    } catch(e) {
      // Audio context fallbacks
    }
  }

  // Realtime Listener across all connected devices
  onValue(dbRef, (snapshot) => {
    document.getElementById('sync-text').innerText = "Firebase Live Auto-Sync Active";
    if (snapshot.exists()) {
      state = snapshot.val();
      if(!state.logs) state.logs = [];
      updateUI();
    } else {
      // Initial state push
      saveStateToCloud();
    }
  }, (error) => {
    console.error("Firebase Sync Error:", error);
    document.getElementById('sync-text').innerText = "Sync Error - Check Firebase Database Rules";
  });

  function saveStateToCloud() {
    set(dbRef, state);
  }

  function updateUI() {
    document.getElementById('lvl-display').innerText = state.level || 1;
    document.getElementById('streak-display').innerText = state.streak || 0;
    document.getElementById('count-display').innerText = state.totalLogs || 0;

    // XP calculation
    const currentXp = state.xp || 0;
    const xpForNextLevel = (state.level || 1) * 100;
    const progressPct = Math.min(100, Math.round((currentXp / xpForNextLevel) * 100));
    
    document.getElementById('xp-text').innerText = `${currentXp} / ${xpForNextLevel} XP`;
    document.getElementById('xp-bar').style.width = `${progressPct}%`;

    // Render activity history table
    const list = document.getElementById('log-list');
    if(!state.logs || state.logs.length === 0) {
      list.innerHTML = '<li style="color: var(--text-muted); padding: 12px; text-align: center;">No entries logged yet! Tap the button above!</li>';
      return;
    }
    
    list.innerHTML = state.logs.slice().reverse().map(log => `
      <li class="log-item">
        <span><i class="fa-solid fa-circle-check" style="color:#10ac84; margin-right:8px;"></i>BENNET Method Session</span>
        <span class="log-badge">+25 XP</span>
        <span style="color: var(--text-muted); font-size:0.8rem;">${log}</span>
      </li>
    `).join('');
  }

  // Button Action Handler
  document.getElementById('action-btn').addEventListener('click', () => {
    const now = new Date();
    const timestampStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const todayStr = now.toISOString().split('T')[0];

    // Calculate streak
    if (state.lastLoggedDate !== todayStr) {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().split('T')[0];

      if (state.lastLoggedDate === yesterdayStr) {
        state.streak += 1;
      } else {
        state.streak = 1;
      }
      state.lastLoggedDate = todayStr;
    }

    state.totalLogs = (state.totalLogs || 0) + 1;
    state.xp = (state.xp || 0) + 25;
    
    // Level up calculation
    const xpNeeded = state.level * 100;
    if (state.xp >= xpNeeded) {
      state.level += 1;
    }

    if(!state.logs) state.logs = [];
    state.logs.push(timestampStr);

    // Effects
    if (window.confetti) {
      confetti({ particleCount: 65, spread: 70, origin: { y: 0.7 } });
    }
    playMeow();

    // Persist
    saveStateToCloud();
  });

  // Kitten Interaction Handler
  document.getElementById('kitten-card').addEventListener('click', () => {
    playMeow();
    const phrases = [
      "Purrrfect job with the BENNET method! ✨",
      "Keep that daily streak glowing! 🐾",
      "You're crushing your habit goals!",
      "Meow! So proud of you! ❤️",
      "Consistency is your superpower!"
    ];
    document.getElementById('kitten-speech').innerText = phrases[Math.floor(Math.random() * phrases.length)];
  });
</script>
</body>
</html>
